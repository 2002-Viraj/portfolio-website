<!DOCTYPE html>
<html>
<head>
  <title>Portfolio Messages</title>

  <style>
    body{
      font-family:Arial;
      background:#0f172a;
      color:white;
      padding:30px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#1e293b;
    }

    th,td{
      border:1px solid #334155;
      padding:12px;
      text-align:left;
    }

    th{
      background:#0ea5e9;
    }

    tr:nth-child(even){
      background:#273549;
    }
  </style>
</head>

<body>

<h1>Portfolio Messages</h1>

<table>

<thead>
<tr>
<th>Date</th>
<th>Time</th>
<th>Name</th>
<th>Email</th>
<th>Message</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCbvKKvD8TatGAy14RZFdhNqIhGOghRl0A",
  authDomain: "viraj-portfolio-dfa49.firebaseapp.com",
  databaseURL: "https://viraj-portfolio-dfa49-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "viraj-portfolio-dfa49",
  storageBucket: "viraj-portfolio-dfa49.firebasestorage.app",
  messagingSenderId: "252340703342",
  appId: "1:252340703342:web:5cbaaf60afdcb7f031567f"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const tableBody = document.getElementById("tableBody");

onValue(ref(db, "messages"), (snapshot)=>{

  tableBody.innerHTML = "";

  snapshot.forEach((child)=>{

    const data = child.val();

    tableBody.innerHTML += `
      <tr>
        <td>${data.date}</td>
        <td>${data.time}</td>
        <td>${data.name}</td>
        <td>${data.email}</td>
        <td>${data.message}</td>
      </tr>
    `;

  });

});

</script>

</body>
</html>
